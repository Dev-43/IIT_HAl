[project]
name = "halxopt"
version = "0.1.0"
description = "AeroOptima — Hybrid-Electric UAV Propulsion Optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "deap>=1.3.3",
    "gymnasium>=0.28.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "uv",
    "pytest>=7.0.0",
]

# Optional: only needed for policy_mode="rl" (training or inference). The base app
# (policy_mode="heuristic", the default) never imports these — see backend/rl_policy.py's
# lazy import. Install with: uv sync --extra rl
[project.optional-dependencies]
rl = [
    "torch>=2.0.0",
    "stable-baselines3>=2.0.0",
]

[tool.uv]
package = false
